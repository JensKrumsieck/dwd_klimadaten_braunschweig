[project]
name = "dwd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jens Krumsieck", email = "j.krumsieck@outlook.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "polars>=1.44.1",
    "scienceplots>=2.2.2",
    "wetterdienst>=0.136.0",
]

[project.scripts]
dwd = "dwd:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
